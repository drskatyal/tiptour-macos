[package]
name = "tiptour-cross"
version = "0.0.1"
description = "TipTour cross-platform voice agent"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "macos-private-api", "devtools"] }
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
keyring = "3"
parking_lot = "0.12"
anyhow = "1"
once_cell = "1"
dirs = "5"
rdev = "0.5"
hound = "3.5"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
enigo = "0.3"
arboard = "3"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
strsim = "0.11"
vosk = { version = "0.3", optional = true }
ureq = { version = "2", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.16"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_Foundation"] }
windows-capture = "1"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.24"
screencapturekit = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
vosk = ["dep:vosk", "dep:ureq", "dep:zip"]
