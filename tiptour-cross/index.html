<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TipTour</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel-header">
        <span class="dot" data-status="idle"></span>
        <span class="status-label" id="status-label">Idle</span>
      </header>

      <section class="api-key">
        <label for="api-key-input">Gemini API key</label>
        <input id="api-key-input" type="password" autocomplete="off" spellcheck="false" />
        <button id="api-key-save">Save</button>
      </section>

      <section class="permissions" id="permissions-section" hidden>
        <div class="permissions-label">macOS permissions needed</div>
        <div class="permission-row" id="ax-permission-row" hidden>
          <span>Accessibility (for clicks &amp; typing)</span>
          <button id="grant-accessibility">Grant</button>
        </div>
        <div class="permission-row" id="screen-permission-row" hidden>
          <span>Screen recording (so Gemini can see)</span>
          <button id="grant-screen-recording">Grant</button>
        </div>
      </section>

      <section class="mode-toggle">
        <label for="mode-select">Mode</label>
        <select id="mode-select">
          <option value="autopilot">Autopilot — TipTour clicks for me</option>
          <option value="teaching">Teaching — point, I click</option>
        </select>
      </section>

      <section class="actions">
        <button id="start-listening" class="primary">Start listening</button>
        <button id="stop-listening" class="secondary" hidden>Stop</button>
      </section>

      <section class="hotkey-hint">
        Or press <kbd id="hotkey-display">Alt + X</kbd> anywhere.
      </section>

      <section class="error-banner" id="error-banner" hidden></section>

      <section class="saved-flows" id="saved-flows-section">
        <div class="saved-flows-header">
          <span class="saved-flows-title">Saved flows</span>
          <button id="record-flow-toggle" class="saved-flows-record">Record new flow</button>
        </div>
        <div class="record-flow-naming" id="record-flow-naming" hidden>
          <input
            id="record-flow-name-input"
            type="text"
            placeholder="Flow name (e.g. morning routine)"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="record-flow-confirm">Start</button>
          <button id="record-flow-cancel" class="record-flow-cancel">Cancel</button>
        </div>
        <ul id="saved-flows-list" class="saved-flows-list"></ul>
      </section>

      <section class="transcript" id="transcript"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
