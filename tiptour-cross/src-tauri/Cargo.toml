[package]
name = "tiptour-cross"
version = "0.0.1"
description = "TipTour cross-platform voice agent"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tiptour_cross_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
keyring = "3"
parking_lot = "0.12"
anyhow = "1"
once_cell = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
