<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TipTour Draft</title>
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/drafting/drafting.css" />
  </head>
  <body class="drafting-body">
    <header class="drafting-toolbar" data-tauri-drag-region>
      <div class="drafting-toolbar-left" data-tauri-drag-region>
        <span class="drafting-app-badge" data-tauri-drag-region>Draft</span>
        <span class="drafting-status" id="drafting-status" data-tauri-drag-region>Ready</span>
      </div>
      <div class="drafting-toolbar-right">
        <button id="drafting-format-bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
        <button id="drafting-format-italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
        <button id="drafting-format-h2" title="Heading" aria-label="Format as heading">H2</button>
        <button id="drafting-format-list" title="Bullet list" aria-label="Format as bullet list">•</button>
        <button id="drafting-format-code" title="Inline code" aria-label="Format as code"><code>‹/›</code></button>
        <span class="drafting-toolbar-divider"></span>
        <button id="drafting-copy-rich" class="drafting-action">Copy</button>
        <button id="drafting-replace-selection" class="drafting-action primary">
          Replace selection
        </button>
      </div>
    </header>

    <main class="drafting-main">
      <div
        id="drafting-editor"
        class="drafting-editor"
        contenteditable="true"
        spellcheck="true"
        aria-label="Draft editor"
      ></div>
    </main>

    <footer class="drafting-footer" id="drafting-footer">
      <span id="drafting-provenance" class="drafting-provenance"></span>
      <span id="drafting-stats" class="drafting-stats">0 words</span>
    </footer>

    <script type="module" src="/src/drafting/main.ts"></script>
  </body>
</html>
