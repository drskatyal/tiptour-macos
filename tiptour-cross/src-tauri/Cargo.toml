[package]
name = "tiptour-cross"
version = "0.0.1"
description = "TipTour cross-platform voice agent"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "macos-private-api", "devtools"] }
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
keyring = "3"
parking_lot = "0.12"
anyhow = "1"
once_cell = "1"
dirs = "5"
rdev = "0.5"
hound = "3.5"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
enigo = "0.3"
arboard = "3"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
strsim = "0.11"
vosk = { version = "0.3", optional = true }
ureq = { version = "2", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
plist = "1"
# Optional vector-DB + on-device embedder for agent memory. These are
# heavy native deps (LanceDB pulls Arrow + tokio runtime extras;
# fastembed downloads an ONNX model on first use). They are gated
# behind the `agent-memory-vector` feature so default builds stay lean
# and Linux CI doesn't need to compile the full Arrow stack. When the
# feature is off, the memory store falls back to a JSON-backed
# bag-of-words ranker that exposes the same Tauri command surface, so
# the UI + Gemini tool layer work unchanged.
lancedb = { version = "0.10", optional = true }
fastembed = { version = "4", optional = true }
arrow = { version = "53", optional = true }
arrow-array = { version = "53", optional = true }
arrow-schema = { version = "53", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.16"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Registry"] }
windows-capture = "1"
lnk = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
# 0.25 specifically because 0.24 transitively pulls in core-foundation 0.9,
# which clashes with our direct 0.10 dep. `&CFString` from 0.10 then can't
# be passed to a `CFDictionary` from 0.9 (different `ToVoid` trait). 0.25
# uses core-foundation 0.10 and the version conflict disappears.
core-graphics = "0.25"
# screencapturekit was used for macOS screen capture; we now use the
# simpler CGDisplay::image() path in src/screen/capture.rs which avoids
# the fragile SCK Rust binding API churn. Re-introduce SCK when the
# bindings stabilize and we need >1 fps capture.

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
vosk = ["dep:vosk", "dep:ureq", "dep:zip"]
agent-memory-vector = [
    "dep:lancedb",
    "dep:fastembed",
    "dep:arrow",
    "dep:arrow-array",
    "dep:arrow-schema",
]
